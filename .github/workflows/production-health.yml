name: Alyvero production health

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

jobs:
  health:
    name: Live site health check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run production health check
        run: npm run healthcheck
