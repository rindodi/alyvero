name: Alyvero IndexNow

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  submit:
    name: Notify IndexNow
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build changed URL list
        id: urls
        shell: bash
        run: |
          python - <<'PY'
          import os, subprocess

          base = "https://www.alyvero.co.ke"
          key_file = "public/9905aaadee2648ac9292dcbad2dfcaeb.txt"

          core = [
              "", "/tools", "/pdf-tools", "/image-tools", "/guides", "/glossary",
              "/pdf-to-word", "/compress-pdf", "/compress-image", "/heic-to-jpg",
              "/image-to-pdf", "/merge-pdf", "/split-pdf", "/pdf-to-jpg",
              "/resize-image", "/jpg-to-png", "/about", "/privacy", "/terms", "/contact"
          ]

          if os.environ.get("GITHUB_EVENT_NAME") == "workflow_dispatch":
              paths = []
              force_all = True
          else:
              try:
                  paths = subprocess.check_output(
                      ["git", "diff", "--name-only", "HEAD^", "HEAD"],
                      text=True
                  ).splitlines()
              except subprocess.CalledProcessError:
                  paths = []
              force_all = any(
                  p in {
                      ".github/workflows/indexnow.yml",
                      "app/layout.tsx",
                      "app/globals.css",
                      "app/sitemap.ts",
                      "app/robots.ts",
                      "lib/compressPdfGuides.ts",
                      key_file,
                  } for p in paths
              )

          urls = set()

          if force_all:
              urls.update(base + p for p in core)
          else:
              for path in paths:
                  if path.startswith("app/") and path.endswith((".tsx", ".ts")):
                      parts = path.split("/")
                      if len(parts) >= 2:
                          route = parts[1]
                          if route not in {"api", "opengraph-image.tsx", "icon.svg"}:
                              urls.add(base + ("" if route == "page.tsx" else "/" + route))
                  elif path.startswith("lib/") and "compressPdfGuides" in path:
                      urls.add(base + "/guides")

          urls = sorted(urls)
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("count=" + str(len(urls)) + "\n")
              f.write("urls<<EOF\n")
              f.write("\n".join(urls))
              f.write("\nEOF\n")

          print("\n".join(urls))
          PY

      - name: Submit URLs to IndexNow
        if: steps.urls.outputs.count != '0'
        env:
          INDEXNOW_KEY: 9905aaadee2648ac9292dcbad2dfcaeb
          INDEXNOW_URLS: ${{ steps.urls.outputs.urls }}
        run: |
          python - <<'PY'
          import json, os, urllib.request

          urls = [u for u in os.environ["INDEXNOW_URLS"].splitlines() if u.strip()]
          payload = {
              "host": "www.alyvero.co.ke",
              "key": os.environ["INDEXNOW_KEY"],
              "keyLocation": "https://www.alyvero.co.ke/9905aaadee2648ac9292dcbad2dfcaeb.txt",
              "urlList": urls,
          }

          req = urllib.request.Request(
              "https://api.indexnow.org/indexnow",
              data=json.dumps(payload).encode("utf-8"),
              headers={"Content-Type": "application/json; charset=utf-8"},
              method="POST",
          )

          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  print(f"IndexNow HTTP {response.status}")
                  body = response.read().decode("utf-8", errors="replace")
                  if body:
                      print(body)
          except urllib.error.HTTPError as e:
              print(f"IndexNow HTTP {e.code}")
              print(e.read().decode("utf-8", errors="replace"))
              raise
          PY

      - name: No URLs changed
        if: steps.urls.outputs.count == '0'
        run: echo "No indexable Alyvero URLs changed; nothing submitted."
